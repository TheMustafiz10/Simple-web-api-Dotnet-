services:
  db:
    image: postgres
    container_name: tripapi-db
    restart: always
    environment:
      POSTGRES_USER: mustafiz
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: trip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: tripapi-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=trip;Username=mustafiz;Password=pass123"

volumes:
  postgres_data: